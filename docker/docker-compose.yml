services:
  db:
    image: postgres:15-alpine
    env_file: ../backend/.env
    environment:
      POSTGRES_DB: fsm
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d fsm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../backend/.env
    ports: ["8002:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
    command:
      - /bin/sh
      - -c
      - export DATABASE_URL="postgresql+asyncpg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@db:5432/fsm"; exec uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: [uploads:/app/uploads]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
